<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIGHT ZONE</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #05050a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Segoe UI', sans-serif;
    color: #e0e0e0;
    user-select: none;
    gap: 0;
  }

  #game-canvas {
    display: block;
    border: 2px solid #2a2a40;
    border-radius: 4px 4px 0 0;
    box-shadow: 0 0 40px rgba(180,74,255,0.2);
  }

  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  #overlay h2 {
    font-size: 2.5rem; font-weight: 900; letter-spacing: 0.15em;
    color: #fff; text-shadow: 0 0 30px #b44aff; margin-bottom: 12px;
  }
  #overlay p { color: #aaa; font-size: 1rem; margin-bottom: 20px; }
  #overlay button {
    padding: 12px 40px; font-size: 1rem; font-weight: 700;
    background: linear-gradient(135deg,#7b00d4,#b44aff);
    color: #fff; border: none; border-radius: 8px; cursor: pointer;
  }
  #overlay button:hover { filter: brightness(1.15); }
  #overlay.hidden { display: none; }

  #key-hint {
    font-size: 0.72rem; color: #444; letter-spacing: 0.05em;
    background: #0a0a12; border-left: 2px solid #2a2a40;
    border-right: 2px solid #2a2a40;
    width: 800px; padding: 5px 12px;
    text-align: center;
  }

  /* ── 채팅 ── */
  #chat-wrap {
    width: 800px;
    background: rgba(8,8,16,0.92);
    border: 2px solid #2a2a40;
    border-top: none;
    border-radius: 0 0 6px 6px;
  }
  #chat-msgs {
    height: 110px;
    overflow-y: auto;
    padding: 8px 12px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    scrollbar-width: thin;
    scrollbar-color: #333 transparent;
  }
  #chat-msgs::-webkit-scrollbar { width: 4px; }
  #chat-msgs::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
  .chat-line { font-size: 0.82rem; line-height: 1.4; }
  .chat-sys  { color: #555; font-style: italic; }
  #chat-bar {
    display: flex;
    border-top: 1px solid #1e1e2e;
    padding: 6px 8px;
    gap: 6px;
    align-items: center;
  }
  #chat-hint { font-size: .68rem; color: #444; margin-right: 4px; white-space: nowrap; }
  #chat-in {
    flex: 1;
    background: #0d0d1a; border: 1px solid #2a2a40; border-radius: 4px;
    color: #e0e0e0; padding: 6px 10px; font-size: 0.83rem;
    outline: none; transition: border-color .2s;
    font-family: 'Segoe UI', sans-serif;
  }
  #chat-in:focus { border-color: #b44aff; }
  #chat-in::placeholder { color: #444; }
  #chat-btn {
    background: #2a2a40; border: none; border-radius: 4px;
    color: #ccc; padding: 6px 14px; font-size: 0.82rem; cursor: pointer;
    transition: background .15s;
  }
  #chat-btn:hover { background: #3a3a55; }
</style>
</head>
<body>

<canvas id="game-canvas" width="800" height="500"></canvas>
<div id="key-hint">← → 이동 &nbsp;|&nbsp; SPACE 점프 &nbsp;|&nbsp; ↓ 방어 &nbsp;|&nbsp; Z 약공격 &nbsp;|&nbsp; X 강공격 &nbsp;|&nbsp; C 필살기</div>

<div id="chat-wrap">
  <div id="chat-msgs"></div>
  <div id="chat-bar">
    <span id="chat-hint">클릭 후 입력 → Enter 전송</span>
    <input id="chat-in" type="text" placeholder="메시지 입력 후 Enter 전송 / Esc 닫기" maxlength="80" autocomplete="off">
    <button id="chat-btn">전송</button>
  </div>
</div>

<div id="overlay">
  <h2 id="overlay-title">연결 중...</h2>
  <p id="overlay-sub"></p>
  <div class="score-display" id="overlay-score" style="display:none"></div>
  <button id="overlay-btn" style="display:none" onclick="goLobby()">로비로 돌아가기</button>
</div>

<script src="/game.js?v=20260723-low-power-3"></script>
</body>
</html>
