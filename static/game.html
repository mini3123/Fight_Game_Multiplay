<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIGHT ZONE</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #05050a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Segoe UI', sans-serif;
    color: #e0e0e0;
    user-select: none;
  }

  #game-canvas {
    display: block;
    border: 2px solid #2a2a40;
    border-radius: 4px;
    box-shadow: 0 0 40px rgba(180, 74, 255, 0.2);
    image-rendering: pixelated;
  }

  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  #overlay h2 {
    font-size: 2.5rem;
    font-weight: 900;
    letter-spacing: 0.15em;
    color: #fff;
    text-shadow: 0 0 30px #b44aff;
    margin-bottom: 12px;
  }
  #overlay p { color: #aaa; font-size: 1rem; margin-bottom: 20px; }
  #overlay .score-display {
    font-size: 3rem;
    font-weight: 900;
    color: #b44aff;
    margin: 8px 0 20px;
  }
  #overlay button {
    padding: 12px 40px;
    font-size: 1rem;
    font-weight: 700;
    background: linear-gradient(135deg, #7b00d4, #b44aff);
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    letter-spacing: 0.08em;
  }
  #overlay button:hover { filter: brightness(1.15); }
  #overlay.hidden { display: none; }

  #key-hint {
    margin-top: 10px;
    font-size: 0.72rem;
    color: #444;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>

<canvas id="game-canvas" width="800" height="500"></canvas>
<div id="key-hint">← → 이동 &nbsp;|&nbsp; SPACE 점프 &nbsp;|&nbsp; ↓ 방어 &nbsp;|&nbsp; Z 약공격 &nbsp;|&nbsp; X 강공격 &nbsp;|&nbsp; C 필살기</div>

<div id="overlay">
  <h2 id="overlay-title">연결 중...</h2>
  <p id="overlay-sub"></p>
  <div class="score-display" id="overlay-score" style="display:none"></div>
  <button id="overlay-btn" style="display:none" onclick="goLobby()">로비로 돌아가기</button>
</div>

<script src="/game.js"></script>
</body>
</html>
